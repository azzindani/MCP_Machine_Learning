# ─────────────────────────────────────────────────────────────────────────────
# mcp-machine-learning — local & VPS-friendly compose stack.
#
# One image, ONE container: unified_server.py mounts all 3 tiers
# (basic/medium/advanced) as separate MCP endpoints on one port, so pandas/
# numpy/scikit-learn/xgboost load once instead of three times. All three
# share one bearer-auth token set (ML_TOKENS_FILE / ML_TOKENS / ML_API_KEY)
# since they're one logical deployment unit.
#
# Quick start (open mode, no auth — localhost/private network only):
#   docker compose up -d --build
#   curl http://localhost:8820/health            # aggregate
#   curl http://localhost:8820/basic/health       # per tier
#   curl http://localhost:8820/medium/health
#   curl http://localhost:8820/advanced/health
#
# With auth: cp tokens.example.json tokens.json && docker compose up -d --build
# ─────────────────────────────────────────────────────────────────────────────
services:
  ml:
    build:
      context: .
    image: ${ML_IMAGE:-mcp-machine-learning:latest}
    container_name: mcp-ml
    restart: unless-stopped
    ports:
      - "${ML_HOST_PORT:-8820}:8820"
    environment:
      ML_HOST: 0.0.0.0
      ML_PORT: 8820
      ML_TOKENS_FILE: ${ML_TOKENS_FILE:-}
      ML_TOKENS: ${ML_TOKENS:-}
      ML_API_KEY: ${ML_API_KEY:-}
      MCP_CONSTRAINED_MODE: ${MCP_CONSTRAINED_MODE:-0}
      # OAuth 2.0 bridge for clients that require it (e.g. claude.ai's Custom
      # Connector) instead of a plain bearer header — see shared/oauth_bridge.py.
      # One state dir per tier (each is its own claude.ai connector, at its
      # own /basic, /medium, /advanced path) even though it's one process/port.
      # Only takes effect when a token source above is set; harmless otherwise.
      ML_BASIC_OAUTH_STATE_DIR: /home/app/.oauth-state/basic
      ML_MEDIUM_OAUTH_STATE_DIR: /home/app/.oauth-state/medium
      ML_ADVANCED_OAUTH_STATE_DIR: /home/app/.oauth-state/advanced
      ML_OAUTH_CLIENT_ID: ${ML_OAUTH_CLIENT_ID:-}
      ML_OAUTH_CLIENT_SECRET: ${ML_OAUTH_CLIENT_SECRET:-}
    mem_limit: ${ML_MEM_LIMIT:-1g}
    volumes:
      - ./tokens.json:/home/app/tokens.json:ro
      # Persists OAuth-issued access/refresh tokens (one subdir per tier) so a
      # container restart doesn't force claude.ai to reauthorize. `mkdir -p
      # oauth-state && chown 999:999 oauth-state` before first run — left
      # root-owned, the container's non-root user can't write to it.
      - ./oauth-state:/home/app/.oauth-state
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8820/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
