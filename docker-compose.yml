# ─────────────────────────────────────────────────────────────────────────────
# mcp-machine-learning — local & VPS-friendly compose stack.
#
# One image, ONE container: unified_server.py mounts all 3 tiers
# (basic/medium/advanced) as separate MCP endpoints on one port, so pandas/
# numpy/scikit-learn/xgboost load once instead of three times. All three
# share one bearer-auth token set (ML_TOKENS_FILE / ML_TOKENS / ML_API_KEY)
# since they're one logical deployment unit.
#
# Quick start (open mode, no auth — localhost/private network only):
#   docker compose up -d --build
#   curl http://localhost:8820/health            # aggregate
#   curl http://localhost:8820/basic/health       # per tier
#   curl http://localhost:8820/medium/health
#   curl http://localhost:8820/advanced/health
#
# With auth: cp tokens.example.json tokens.json && docker compose up -d --build
# ─────────────────────────────────────────────────────────────────────────────
services:
  ml:
    build:
      context: .
    image: ${ML_IMAGE:-mcp-machine-learning:latest}
    container_name: mcp-ml
    restart: unless-stopped
    ports:
      - "${ML_HOST_PORT:-8820}:8820"
    environment:
      ML_HOST: 0.0.0.0
      ML_PORT: 8820
      ML_TOKENS_FILE: ${ML_TOKENS_FILE:-}
      ML_TOKENS: ${ML_TOKENS:-}
      ML_API_KEY: ${ML_API_KEY:-}
      MCP_CONSTRAINED_MODE: ${MCP_CONSTRAINED_MODE:-0}
      # OAuth 2.0 bridge for clients that require it (e.g. claude.ai's Custom
      # Connector) instead of a plain bearer header — see shared/oauth_bridge.py.
      # One state dir per tier (each is its own claude.ai connector, at its
      # own /basic, /medium, /advanced path) even though it's one process/port.
      # Only takes effect when a token source above is set; harmless otherwise.
      # ML_PUBLIC_URL is the public HTTPS origin (no trailing slash, no tier
      # suffix) this service is reachable at through the reverse proxy — each
      # server.py appends its own /basic, /medium, /advanced. REQUIRED for
      # OAuth discovery to work once mounted behind a path prefix: without it,
      # the 401's WWW-Authenticate hint falls back to the internal bind
      # address, which claude.ai can't reach.
      ML_PUBLIC_URL: ${ML_PUBLIC_URL:-}
      ML_BASIC_OAUTH_STATE_DIR: /home/app/.oauth-state/basic
      ML_MEDIUM_OAUTH_STATE_DIR: /home/app/.oauth-state/medium
      ML_ADVANCED_OAUTH_STATE_DIR: /home/app/.oauth-state/advanced
      ML_OAUTH_CLIENT_ID: ${ML_OAUTH_CLIENT_ID:-}
      ML_OAUTH_CLIENT_SECRET: ${ML_OAUTH_CLIENT_SECRET:-}
      # Hybrid file exchange — see README "Hybrid local + remote file handling".
      # MCP_OUTPUT_DIR doubles as the in-container mount point below so the
      # two can never drift apart: point MCP_SHARED_DIR at a host directory
      # your file server also serves, set MCP_PUBLIC_BASE_URL to that
      # directory's public URL, and every model, report, plot and prediction
      # CSV comes back with a `public_url` the caller can actually open.
      # Without this, outputs land in ~/Downloads *inside the container* — a
      # black hole for any remote caller.
      MCP_OUTPUT_DIR: ${MCP_OUTPUT_DIR:-/files}
      MCP_PUBLIC_BASE_URL: ${MCP_PUBLIC_BASE_URL:-}
      # Off by default. With it on, any file_path argument may be an http(s)
      # URL. Hosts resolving to loopback/link-local/private addresses are
      # refused unless MCP_FETCH_ALLOW_PRIVATE=1 — don't relax that on a
      # publicly reachable deployment.
      MCP_FETCH_URLS: ${MCP_FETCH_URLS:-0}
      MCP_FETCH_ALLOW_PRIVATE: ${MCP_FETCH_ALLOW_PRIVATE:-0}
      MCP_MAX_FETCH_MB: ${MCP_MAX_FETCH_MB:-100}
      # Trained models are HMAC-signed with a server-local key and every
      # loading tool verifies before unpickling. The key defaults to
      # ~/.mcp_ml_signing_key, which lives in the image — so a rebuild issued a
      # new one and every model already saved to the mounted output volume came
      # back "Model file signature is invalid", which reads as tampering, for
      # files this server wrote itself. Keep it on the persisted volume.
      MCP_ML_SIGNING_KEY_FILE: /home/app/.model-keys/signing.key
    mem_limit: ${ML_MEM_LIMIT:-1g}
    volumes:
      - ./tokens.json:/home/app/tokens.json:ro
      # Shared output directory (see MCP_OUTPUT_DIR above). The container
      # writes as uid/gid 999 (`app`), so `chown 999:999` the host directory
      # before first run — left root-owned, every generated file fails with
      # EACCES, same gotcha as oauth-state below.
      - ${MCP_SHARED_DIR:-./shared-files}:${MCP_OUTPUT_DIR:-/files}
      # Persists OAuth-issued access/refresh tokens (one subdir per tier) so a
      # container restart doesn't force claude.ai to reauthorize. `mkdir -p
      # oauth-state && chown 999:999 oauth-state` before first run — left
      # root-owned, the container's non-root user can't write to it.
      - ./oauth-state:/home/app/.oauth-state
      # Holds the model signing key (see MCP_ML_SIGNING_KEY_FILE above). Same
      # ownership gotcha: `mkdir -p model-keys && chown 999:999 model-keys`.
      - ./model-keys:/home/app/.model-keys
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8820/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
