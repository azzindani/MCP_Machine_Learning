name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]

    # No MCP_CONSTRAINED_MODE here: this is the normal-limits run. It used to
    # set it, which meant every job in this workflow -- including the one below
    # actually named "Constrained mode (ubuntu)" -- tested the same branch, and
    # the unconstrained half of every get_max_* helper was never exercised in
    # CI. The second job's name was what made it read as coverage of both.
    env:
      PYTHONPATH: "."

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.14"

      - name: Install libomp (macOS)
        if: runner.os == 'macOS'
        run: brew install libomp

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Type check (pyright)
        run: uv run pyright servers/ shared/

      - name: Run tests
        run: uv run python -m pytest tests/ -q --tb=short --cov=servers --cov=shared --cov-report=term-missing --cov-fail-under=70

  constrained:
    name: Constrained mode (ubuntu)
    runs-on: ubuntu-22.04

    env:
      MCP_CONSTRAINED_MODE: "1"
      PYTHONPATH: "."

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests in constrained mode
        run: uv run python -m pytest tests/ -q --tb=short --cov=servers --cov=shared --cov-report=term-missing --cov-fail-under=70

  # The suite above never starts a server (STANDARDS.md keeps pytest offline),
  # so nothing until now proved that what we ship answers a request. This job
  # also builds that thing on the way in -- `docker compose up --build` from
  # the same context and Dockerfile a release would use. Shared action, because
  # this is identical in all seven repos and drift between copies is the bug
  # that keeps costing rounds.
  #
  # That is why there is no separate build-only job any more. One existed, and
  # it could not fail in any case where this job does not fail first; all it
  # added was a second full image build on every push -- and this repo's image
  # is one of the expensive ones.
  e2e:
    name: End-to-end (container)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Smoke test every tool over HTTP
        uses: azzindani/MCP_Math/.github/actions/e2e-smoke@main
        with:
          port: "8820"
          key-env: ML_API_KEY
          # Deliberately not the deployed hostname. Rebinding protection is off,
          # so any Host must be accepted; an arbitrary one proves exactly that
          # and keeps the real domain out of one more file.
          public-host: ml.example.com
          mcp-path: /basic/mcp
          health-timeout: "180"
          create-dirs: "oauth-state model-keys"
          shared-dir: shared-files
