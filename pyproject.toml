[project]
name = "mcp-machine-learning"
version = "0.1.2"
description = "Local-first MCP server for machine learning"
requires-python = "==3.14.*"
dependencies = [
    "mcp>=1.0,<2.0",
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "psutil>=5.9",
    "plotly>=5.0",
    "scipy>=1.10",
]

[dependency-groups]
dev = [
    "pyright>=1.1.408",
    "pytest>=9.0.2",
    "pytest-cov>=5.0",
    "ruff>=0.9",
]

[project.scripts]
ml-basic = "servers.ml_basic.server:main"
ml-medium = "servers.ml_medium.server:main"
ml-advanced = "servers.ml_advanced.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["servers", "shared"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"

[tool.coverage.run]
omit = ["*/server.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "def main\\(\\):",
]

[tool.ruff]
line-length = 120
target-version = "py314"
exclude = ["*.ipynb", "ML_Lookup.ipynb", "install/*.sh", "install/*.bat"]

[tool.ruff.format]
# Lint shared/, never rewrite it. These modules are meant to stay byte-identical
# with their siblings in the other repos, and the formatter forks them silently:
# one repo lints at line-length 100 and the rest at 120, which is how a sibling
# ended up 77 lines different from its twin by pure reflow, with nothing in the
# diff to say no logic had changed. shared/quality.py has a test asserting it
# matches its twin in MCP_Data_Analyst, and this keeps `ruff format` from
# breaking that assertion on the next unrelated commit. shared/counts.py has no
# such test yet, and has already forked on whitespace in the repos that lack
# this exclude: it needs the same guard and the same test.
exclude = ["shared/**"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E402", "E501", "F401", "F841"]

[tool.uv]
required-version = ">=0.5"
